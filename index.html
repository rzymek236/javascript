<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Rzymowski 3F - zadanie 5</title>
<script>
function otworzGrafike(nr, top, left) {

    "toolbar=no,directories=no,menubar=no,height=300,width=300,top=" + top + ",left=" + left);

    "zadanie_" + nr, "toolbar=no,directories=no,menubar=no,height=600,width=700,top=100,left=100");
}
function okno_zamknij_rzy_5() { window.close(); }
</script>
</head>
<body>

<h3>Śmieszna historyjka</h3>
