<!DOCTYPE html>

<meta charset="UTF-8">
<title>Zadanie 11 - Rzymowski</title>
</head>
<body>
<div style="color:green;font-size:59px">
<script>
var D1_rzy = parseInt(prompt("Podaj pierwszy dzień stycznia:", ""));
var D2_rzy = parseInt(prompt("Podaj drugi dzień stycznia:", ""));

var sekund = (D1_rzy - D2_rzy) * 24 * 60 * 60;

document.write("Ilość sekund między dniami " +
D1_rzy + " i " + D2_rzy + " = " + sekund);
</script>
</div>
</body>
</html>
