<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Zadanie 8 - Rzymowski</title>
<script>
function show_confirm_rzy() {
    var wynik = confirm("Naciśnij klawisz");

    if (wynik == true) {
        document.body.innerHTML = "Nacisnąłeś OK!";
    } else {
        document.body.innerHTML = "Nacisnąłeś Cancel!";
    }
}
</script>
</head>
<body>
<h2>Zadanie 8 — Confirm Box</h2>
<input type="button" value="Pokaż Confirm Box"
onclick="show_confirm_rzy()">
</body>
</html>
